name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15
            system: aarch64-darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Verify runner architecture
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "$EXPECTED_SYSTEM"
      - name: Check flake and lockfile
        run: nix flake check --no-update-lock-file
      - name: Validate foundation
        run: nix develop --no-update-lock-file -c make check
      - name: Audit Rust dependencies
        run: nix develop --no-update-lock-file -c make audit
      - name: Validate distributions
        run: nix develop --no-update-lock-file -c make package-check
      - name: Validate CPU tensor execution
        run: nix develop --no-update-lock-file -c make cpu-check ML_BACKEND=cpu
      - name: Verify lockfiles stayed unchanged
        run: git diff --exit-code -- flake.lock Cargo.lock python/uv.lock
