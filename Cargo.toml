[workspace]
resolver = "3"
members = ["crates/core", "crates/pyo3"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false
license = "Apache-2.0"
repository = "https://github.com/luzhaoji0/mm-research"

[workspace.dependencies]
mm-core = { path = "crates/core", version = "0.1.0" }
pyo3 = { version = "0.30.1", default-features = false, features = ["macros"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
cognitive_complexity = "warn"
expect_used = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
